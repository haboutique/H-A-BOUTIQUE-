<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H&A Boutique Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
body{background:#111;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.login{max-width:400px;width:100%;background:#222;padding:30px;border-radius:15px;text-align:center}
.login input{width:100%;padding:12px;margin:15px 0;border-radius:8px;border:none}
.login button{width:100%;padding:12px;background:#d8a35d;color:#000;font-weight:bold;border:none;border-radius:8px}
#dash{display:none;width:100%;max-width:900px}
.header{background:#222;padding:15px;border-radius:12px;display:flex;justify-content:space-between;margin-bottom:20px}
</style>
</head>
<body>
<div class="login" id="loginBox">
<h2>H&A Boutique</h2><br><p>Admin Login</p><br>
<input type="password" id="p" placeholder="Password">
<button onclick="go()">Login Karo</button>
<p id="e" style="color:red;margin-top:10px"></p>
</div>
<div id="dash">
<div class="header"><h3>Welcome Azeem Bhai - Dashboard Open ✅</h3><button onclick="logout()" style="padding:8px 15px;border-radius:6px">Logout</button></div>
<div style="background:#222;padding:20px;border-radius:12px">
<p>🎉 Mubarak ho! Dashboard khul gaya hai</p><br>
<p><a href="index.html" style="color:#d8a35d">→ Apni Website Dekho</a></p>
</div>
</div>
<script>
function go(){
let v=document.getElementById('p').value.trim();
if(v==="Azeem$5911"){
document.getElementById('loginBox').style.display='none';
document.getElementById('dash').style.display='block';
localStorage.setItem('ha','1');
}else{document.getElementById('e').innerText='Galat Password';}
}
function logout(){localStorage.removeItem('ha');location.reload();}
if(localStorage.getItem('ha')==='1'){document.getElementById('loginBox').style.display='none';document.getElementById('dash').style.display='block';}
</script>
</body>
</html>
